<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <navbar class="navigation">
            <div class="logo">
                <h1 class="title-logo">TechCoffe</h1>
            </div>
            <div class="nav_desktop">
                <ul>
                    <li><a href="cafe">Café</a></li>
                    <li><a href="equipamentos">Equipamentos</a></li>
                    <li><a href="acessorios">Acessórios</a></li>
                    <li><a href="kits">Kits</a></li>
                    <li><a href="lifestyle">LifesStyle</a></li>
                </ul>
            </div>
            <div class="actions">
                <button class="botao-search">
                    <div class="icon_search">
                        <img src="assets/icons/vetor-search.png" alt="icon search">
                    </div>
                </button>
                <button class="botao-carrinho">
                    <div class="icon_carrinho">
                        <img src="assets/icons/vetor-carrinho.png" alt="icon carrinho">
                    </div>
                </button>
                <button class="botao-perfil">
                    <div class="icon_perfil">
                        <img src="assets/icons/vetor-perfil.png" alt="icon perfil">
                    </div>
                </button>
            </div>
        </navbar>
    </header>
    <!--Cabeçalho-->

    <main class="main">
        <div class="slide01">
           
            <div class="hero_section">
                <img src="assets/img/maquina01.png" alt="">
            </div>
            <div class="heading">
                <h2>Tecnologia, café, </br> e desempenho num só lugar</h2>
            </div>
            <div class="info_heading">
                <p class="info_text">
                    Preparo preciso para os aficionados por tecnologia. Eleve seu ritual diário com equipamentos de alto desempenho e torras artesanais.
                </p>
            </div>
            <div class="actions_main">
                <button class="botao_explore">
                    <p class="explore-text">Explore a coleção</p>
                </button>
                <button class="botao_mais">
                    <p class="mais-text">Ver mais</p>
                </button>
            </div>
        </div>
        <section class="section">
          
        </section>
    </main>
</body>

</html>
